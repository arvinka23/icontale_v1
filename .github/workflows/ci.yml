name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (server)
        run: npx tsc --noEmit

      - name: TypeScript type-check (client, checkJs)
        run: npm run typecheck:client

      - name: Build TypeScript
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build CSS
        run: npm run build:css

  sitemap:
    # Keep sitemap.xml lastmod in sync with the latest main commit.
    # Runs only on pushes to main (skipped on PRs) and commits back
    # to the branch if the file actually changed.
    runs-on: ubuntu-latest
    needs: lint-test-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update sitemap lastmod
        run: node scripts/update-sitemap.js

      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- public/sitemap.xml; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml
            git commit -m "chore(seo): refresh sitemap lastmod [skip ci]"
            git push
          else
            echo "sitemap already up to date"
          fi

  e2e:
    # Browser smoke tests. Runs on every push / PR but in a separate
    # job so the unit suite stays fast, and so Playwright's browser
    # binaries only get downloaded when absolutely needed.
    runs-on: ubuntu-latest
    needs: lint-test-audit

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: 3100
      SOCKET_AUTH_SECRET: e2e-test-secret-playwright
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build TypeScript
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-test-audit

    env:
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      SOCKET_AUTH_SECRET: ci-lighthouse-secret-1234
      LIGHTHOUSE_URL: http://127.0.0.1:3000/

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Lighthouse (mobile + desktop)
        run: npm run perf:lighthouse:ci

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: artifacts/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: lint-test-audit

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t icontale:test .

      - name: Test Docker container
        run: |
          docker run -d --name redis-test redis:7-alpine
          sleep 3
          REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redis-test)
          docker run -d --name icontale-test -p 3000:3000 -e REDIS_URL=redis://$REDIS_IP:6379 icontale:test
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop icontale-test redis-test
