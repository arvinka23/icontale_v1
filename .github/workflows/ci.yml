name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build TypeScript
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build CSS
        run: npm run build:css

  sitemap:
    # Keep sitemap.xml lastmod in sync with the latest main commit.
    # Runs only on pushes to main (skipped on PRs) and commits back
    # to the branch if the file actually changed.
    runs-on: ubuntu-latest
    needs: lint-test-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update sitemap lastmod
        run: node scripts/update-sitemap.js

      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- public/sitemap.xml; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml
            git commit -m "chore(seo): refresh sitemap lastmod [skip ci]"
            git push
          else
            echo "sitemap already up to date"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: lint-test-audit

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t icontale:test .

      - name: Test Docker container
        run: |
          docker run -d --name redis-test redis:7-alpine
          sleep 3
          REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redis-test)
          docker run -d --name icontale-test -p 3000:3000 -e REDIS_URL=redis://$REDIS_IP:6379 icontale:test
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop icontale-test redis-test
